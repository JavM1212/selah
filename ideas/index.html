<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selah Music — Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F5F7;
      --white: #FFFFFF;
      --ink: #1A1D2B;
      --ink-soft: #3D4155;
      --ink-muted: #5F6374;
      --teal: #287369;
      --teal-soft: #E8F5F3;
      --teal-mid: #D0EBE7;
      --purple: #7B4DAA;
      --purple-soft: #F0E8F5;
      --magenta: #A83A6C;
      --magenta-soft: #F5E8EF;
      --orange: #C77B2E;
      --orange-soft: #FFF5E6;
      --blue: #2E6EC7;
      --blue-soft: #E6F0FF;
      --red: #C73E3E;
      --red-soft: #FDE8E8;
      --border: #DFE1E6;
      --col-bg: #EBECF0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh; overflow-x: auto;
    }

    /* ─── LOGIN ─── */
    .login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
      background: linear-gradient(135deg, var(--teal-soft) 0%, var(--purple-soft) 50%, var(--magenta-soft) 100%);
    }
    .login-box {
      background: var(--white); border-radius: 24px; padding: 2.5rem 3rem;
      max-width: 380px; width: 100%; text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .login-logo { height: 56px; margin-bottom: 1.5rem; }
    .login-box h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.35rem; }
    .login-box p { font-size: 0.8rem; color: var(--ink-muted); margin-bottom: 1.75rem; font-weight: 300; }
    .login-input {
      width: 100%; padding: 0.8rem 1.1rem; border: 1.5px solid var(--border);
      border-radius: 10px; font-family: inherit; font-size: 0.85rem;
      outline: none; transition: border-color 0.2s;
    }
    .login-input:focus { border-color: var(--teal); }
    .login-input.error { border-color: var(--red); animation: shake 0.3s; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}
    }
    .login-btn {
      width: 100%; padding: 0.8rem; border: none; border-radius: 10px;
      background: var(--teal); color: var(--white); font-family: inherit;
      font-size: 0.85rem; font-weight: 500; cursor: pointer; margin-top: 0.75rem;
      transition: background 0.2s;
    }
    .login-btn:hover { background: #1F5F57; }

    /* ─── APP SHELL ─── */
    .app { display: none; }
    .app.visible { display: flex; flex-direction: column; min-height: 100vh; }
    .login-screen.hidden { display: none; }

    .topbar {
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 1rem;
      position: sticky; top: 0; z-index: 20;
    }
    .topbar-logo { height: 32px; }
    .topbar-sep { width: 1px; height: 24px; background: var(--border); }
    .topbar h1 { font-size: 0.95rem; font-weight: 600; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
    .topbar-updated { font-size: 0.7rem; color: var(--ink-muted); font-weight: 300; }

    /* ─── FILTERS ─── */
    .filters {
      padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 0.5rem;
      flex-wrap: wrap; background: var(--white); border-bottom: 1px solid var(--border);
    }
    .filter-label { font-size: 0.7rem; color: var(--ink-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 0.25rem; }
    .filter-btn {
      font-family: inherit; font-size: 0.72rem; font-weight: 500;
      padding: 0.3rem 0.7rem; border-radius: 6px; cursor: pointer;
      border: 1.5px solid var(--border); background: var(--white); color: var(--ink-soft);
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--ink-muted); }
    .filter-btn.active { background: var(--teal); color: var(--white); border-color: var(--teal); }
    .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 0.25rem; }

    /* ─── BOARD ─── */
    .board {
      display: flex; gap: 0.75rem; padding: 1rem 1.5rem; flex: 1;
      overflow-x: auto; align-items: flex-start;
    }

    /* ─── COLUMN ─── */
    .col {
      min-width: 300px; max-width: 300px; flex-shrink: 0;
      background: var(--col-bg); border-radius: 12px; padding: 0.75rem;
    }
    .col-header {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.25rem 0.5rem 0.65rem; user-select: none;
    }
    .col-dot { width: 10px; height: 10px; border-radius: 50%; }
    .col-title { font-size: 0.8rem; font-weight: 600; flex: 1; }
    .col-count {
      font-size: 0.7rem; font-weight: 600; min-width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(0,0,0,0.08); color: var(--ink-muted);
    }

    /* ─── CARD ─── */
    .card {
      background: var(--white); border-radius: 8px; padding: 0.85rem;
      margin-bottom: 0.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      cursor: default; transition: box-shadow 0.15s;
      border-left: 3px solid transparent;
    }
    .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.4rem; }
    .card-title { font-size: 0.8rem; font-weight: 600; line-height: 1.35; flex: 1; }
    .card-priority {
      font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.4rem;
      border-radius: 4px; text-transform: uppercase; letter-spacing: 0.06em;
      flex-shrink: 0; line-height: 1.4;
    }
    .p-critical { background: var(--red-soft); color: var(--red); }
    .p-high { background: var(--orange-soft); color: var(--orange); }
    .p-medium { background: var(--blue-soft); color: var(--blue); }
    .p-low { background: var(--col-bg); color: var(--ink-muted); }

    .card-desc {
      font-size: 0.72rem; color: var(--ink-muted); line-height: 1.55;
      font-weight: 300; margin-bottom: 0.5rem;
    }
    .card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 0.35rem; }
    .card-tag {
      font-size: 0.7rem; font-weight: 500; padding: 0.15rem 0.5rem;
      border-radius: 100px; letter-spacing: 0.02em;
    }
    .ct-tienda { background: var(--teal-soft); color: var(--teal); }
    .ct-contenido { background: var(--purple-soft); color: var(--purple); }
    .ct-web { background: var(--magenta-soft); color: var(--magenta); }
    .ct-drm { background: var(--orange-soft); color: var(--orange); }
    .ct-expansion { background: var(--blue-soft); color: var(--blue); }

    .card-owner {
      font-size: 0.7rem; font-weight: 500; color: var(--ink-muted);
      margin-left: auto; display: flex; align-items: center; gap: 0.25rem;
    }
    .owner-dot {
      width: 14px; height: 14px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; font-weight: 700; color: var(--white);
    }

    /* ─── CARD EXPAND ─── */
    .card-details { display: none; margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
    .card.expanded .card-details { display: block; }
    .card-detail-item {
      font-size: 0.7rem; color: var(--ink-soft); padding: 0.2rem 0;
      line-height: 1.5; font-weight: 300;
    }
    .card-detail-item strong { font-weight: 500; color: var(--ink); }
    .card-expand-hint {
      font-size: 0.7rem; color: var(--ink-muted); font-weight: 400;
      margin-top: 0.35rem; opacity: 0.6; font-style: italic;
    }
    .card:hover .card-expand-hint { opacity: 1; }
    .card.expanded .card-expand-hint { display: none; }

    /* ─── PRIORITY LEGEND ─── */
    .priority-legend {
      display: flex; gap: 1.25rem; align-items: center;
    }
    .pl-item { display: flex; align-items: center; gap: 0.3rem; font-size: 0.7rem; color: var(--ink-muted); }
    .pl-dot { width: 8px; height: 8px; border-radius: 3px; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .board { padding: 0.75rem; gap: 0.5rem; }
      .col { min-width: 280px; max-width: 280px; }
      .filters { padding: 0.5rem 0.75rem; }
      .topbar { padding: 0.5rem 0.75rem; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <img src="../img/img-8.png" alt="Selah Music" class="login-logo">
      <h1>Board de Ideas</h1>
      <p>Ingresa la clave para ver el tablero del proyecto</p>
      <input type="password" class="login-input" id="passInput" placeholder="Clave de acceso" autocomplete="off">
      <button class="login-btn" id="loginBtn">Entrar</button>
    </div>
  </div>

  <!-- APP -->
  <div class="app" id="app">
    <div class="topbar">
      <img src="../img/img-8.png" alt="Selah" class="topbar-logo">
      <div class="topbar-sep"></div>
      <h1>Board de Ideas</h1>
      <div class="topbar-right">
        <div class="priority-legend">
          <div class="pl-item"><span class="pl-dot" style="background:var(--red);"></span> Critica</div>
          <div class="pl-item"><span class="pl-dot" style="background:var(--orange);"></span> Alta</div>
          <div class="pl-item"><span class="pl-dot" style="background:var(--blue);"></span> Media</div>
          <div class="pl-item"><span class="pl-dot" style="background:var(--ink-muted);"></span> Baja</div>
        </div>
        <span class="topbar-updated">Act. 26 oct 2026</span>
      </div>
    </div>

    <div class="filters">
      <span class="filter-label">Area</span>
      <button class="filter-btn active" data-area="all">Todas</button>
      <button class="filter-btn" data-area="tienda">Tienda</button>
      <button class="filter-btn" data-area="contenido">Contenido</button>
      <button class="filter-btn" data-area="web">Sitio Web</button>
      <button class="filter-btn" data-area="drm">Proteccion</button>
      <button class="filter-btn" data-area="expansion">Expansion</button>
      <div class="filter-sep"></div>
      <span class="filter-label">Responsable</span>
      <button class="filter-btn active" data-owner="all">Todos</button>
      <button class="filter-btn" data-owner="B">Bryan</button>
      <button class="filter-btn" data-owner="J">Jahir</button>
      <button class="filter-btn" data-owner="JB">Ambos</button>
    </div>

    <div class="board" id="board"></div>
  </div>

  <script>
    function checkPass(p) { return p === 'selahmusic'; }
    var passInput = document.getElementById('passInput');
    var loginBtn = document.getElementById('loginBtn');
    var loginScreen = document.getElementById('loginScreen');
    var app = document.getElementById('app');
    function tryLogin() {
      if (checkPass(passInput.value)) {
        loginScreen.classList.add('hidden'); app.classList.add('visible');
        try { sessionStorage.setItem('selah-auth','1'); } catch(e){}
      } else { passInput.classList.add('error'); setTimeout(function(){passInput.classList.remove('error');},400); }
    }
    loginBtn.addEventListener('click', tryLogin);
    passInput.addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });
    try { if(sessionStorage.getItem('selah-auth')==='1'){ loginScreen.classList.add('hidden'); app.classList.add('visible'); } } catch(e){}

    /*
      PRIORITY CRITERIA (objective):
      - CRITICAL: Blocks revenue or launch. Immediate action.
      - HIGH: Directly impacts growth or user experience. This week.
      - MEDIUM: Improves quality or efficiency. This month.
      - LOW: Nice to have. When there's time.
    */

    var CARDS = [
      // ─── DONE ───
      {id:'d1', title:'Sitio web V1 en vivo', desc:'Responsive, SEO, WhatsApp, redes sociales, deploy en Vercel.', area:'web', owner:'J', priority:'high', status:'done',
        details:['Instrumentos clickeables con info de cursos','Programas para todas las edades','Tienda, precios, testimonios','selah-indol.vercel.app']},
      {id:'d2', title:'Paleta alineada con logo', desc:'Teal, purple, magenta con contraste WCAG AA verificado.', area:'web', owner:'J', priority:'medium', status:'done', details:[]},
      {id:'d3', title:'Google Maps registrado', desc:'Solicitud enviada 25 oct. En revision por Google.', area:'expansion', owner:'J', priority:'medium', status:'done', details:[]},
      {id:'d4', title:'Margenes y costos mapeados', desc:'Teclado, cuerdas, combos — margenes confirmados.', area:'tienda', owner:'JB', priority:'high', status:'done',
        details:['Teclado: venta ₡89,900 / costo ~₡23,000','Cuerdas: venta ₡18,000 / costo ~₡3,100','Margen por instrumento: ~₡25,000','Bateria electrica: ₡375k / normal: ₡475k']},
      {id:'d5', title:'Estrategia de contenido definida', desc:'Publicidad (destacada) vs contenido de respaldo (posts).', area:'contenido', owner:'JB', priority:'high', status:'done',
        details:['Anuncios → post + historia destacada','Shorts/piezas → posts normales','Eventualmente FB/IG Ads']},

      // ─── IN PROGRESS ───
      {id:'p1', title:'Inversion inicial ₡200k', desc:'Jahir pone ₡200k el 2 de noviembre. Cuerdas, cables, stands.', area:'tienda', owner:'J', priority:'critical', status:'progress',
        details:['Plan 1 (₡200k): cuerdas, cables, stands','Plan 2 (₡350k): + audifonos, ukeleles, guitarras','Plan 3 (₡450k): + teclados, sistema apartado','Pago: SINPE o efectivo']},
      {id:'p2', title:'Edicion de video shorts', desc:'Bryan grabo piezas musicales (25 oct). Falta editar mezcla video/audio.', area:'contenido', owner:'B', priority:'critical', status:'progress',
        details:['Piezas conocidas y rapidas para shorts','Falta mezclar video + audio','Contenido listo para subir a redes']},
      {id:'p3', title:'Fotos reales de la academia', desc:'Bryan buscando archivos. Reemplazar stock de Canva.', area:'contenido', owner:'B', priority:'high', status:'progress',
        details:['Fotos actuales son de Canva/Google','Se necesitan fotos reales de clases, instalaciones, alumnos']},
      {id:'p4', title:'Unificar usernames de redes', desc:'Definir IG, TikTok, YouTube juntos. Sentarse a resolverlo.', area:'contenido', owner:'JB', priority:'high', status:'progress',
        details:['IG: usar @selahamusicacademia (el original)','TikTok: cambiar de _cr a selahamusicacademia','YouTube: Jahir necesita credenciales','FB: ok como esta']},

      // ─── TO DO ───
      {id:'t1', title:'Completar datos V1 del sitio', desc:'14 items pendientes de Bryan para quitar placeholders amarillos.', area:'web', owner:'B', priority:'critical', status:'todo',
        details:['Cantidad alumnos e instrumentos (hero)','Foto + bio de Bryan','Nombres/fotos de 3 profesores','Videos testimonios (Familia 3G, nino)','Precios actuales confirmados','Catalogo tienda completo','Link YouTube / pista PGM']},
      {id:'t2', title:'Modelo de financiamiento a clientes', desc:'Definir contrato, proceso de cuotas, bodega de apartados.', area:'tienda', owner:'B', priority:'high', status:'todo',
        details:['Cuotas mientras estudia, contrato + cedula','Instrumento en bodega hasta cancelar','Ejemplo: Stratocaster ₡210k → 3x ₡70k']},
      {id:'t3', title:'Producir anuncios estilo competencia', desc:'Crear anuncios propios al formato de Selah basados en referencia.', area:'contenido', owner:'JB', priority:'high', status:'todo',
        details:['Jahir guardando anuncios de competencia','Crear version propia con estilo Selah','Post + historia destacada']},
      {id:'t4', title:'Consignacion con proveedor', desc:'Explorar opcion de que proveedor envie mercaderia y se devuelva lo no vendido.', area:'tienda', owner:'B', priority:'medium', status:'todo',
        details:['Proveedor en Heredia','Primera compra minima ~₡570k','Opcion consignacion reduce riesgo']},
      {id:'t5', title:'Oportunidad microfonos Broers', desc:'Contacto exclusivo de microfonos de cable. Vender a Broers.', area:'tienda', owner:'B', priority:'medium', status:'todo',
        details:['Broers compraba antes a Mundo Musical','Oportunidad de ser proveedor de microfonos de cable']},

      // ─── BACKLOG ───
      {id:'b1', title:'QR en libros fisicos', desc:'Codigo QR que redirige a la pagina. Actualizable sin reimprimir.', area:'web', owner:'JB', priority:'medium', status:'backlog', details:[]},
      {id:'b2', title:'Preview de libros en web (Issuu)', desc:'Visor flipbook para hojear los libros del PGM online.', area:'web', owner:'J', priority:'medium', status:'backlog', details:[]},
      {id:'b3', title:'Marca de agua digital', desc:'"Selah Music by Bryan Martinez" en contenido descargable.', area:'drm', owner:'J', priority:'medium', status:'backlog', details:[]},
      {id:'b4', title:'Canal de YouTube', desc:'Crear/configurar canal oficial y embeber videos en el sitio.', area:'contenido', owner:'JB', priority:'high', status:'backlog',
        details:['Necesita definir si usar el existente o crear nuevo','Embeber en sitio web cuando exista']},
      {id:'b5', title:'Proteccion de videos (Vimeo/Hotmart)', desc:'DRM ligero para videoclases pagadas. Sin descarga + watermark.', area:'drm', owner:'J', priority:'low', status:'backlog',
        details:['Vimeo Starter: ~$12/mes','Hotmart: gratis (cobra %)','DRM ligero disuade al 95%']},
      {id:'b6', title:'Galeria de fotos/videos', desc:'Seccion en el sitio con presentaciones, recitales, clases.', area:'web', owner:'JB', priority:'low', status:'backlog', details:[]},
      {id:'b7', title:'Sistema de inscripcion online', desc:'Formulario de matricula con seleccion de instrumento y horario.', area:'web', owner:'J', priority:'low', status:'backlog', details:[]},
      {id:'b8', title:'Videos de testimonios', desc:'Familia 3G, nino prodigio, entrevistas a papas.', area:'contenido', owner:'B', priority:'high', status:'backlog',
        details:['Familia 3G: abuelo, hijo, nieto','Nino prodigio: llego a los 4, ahora tiene 10','Entrevistas a papas como formato adicional']},
      {id:'b9', title:'Red de academias', desc:'Meta: una academia nueva por ano. Fortalecer la actual primero.', area:'expansion', owner:'B', priority:'low', status:'backlog',
        details:['Joan y Monica como futuros subdirectores','Criterio: paciencia + adherencia al metodo','Profesores que abran su propia academia = orgullo']},
      {id:'b10', title:'App movil / PWA', desc:'La vision de Bryan: iconos de instrumentos como botones interactivos.', area:'web', owner:'J', priority:'low', status:'backlog', details:[]},
      {id:'b11', title:'E-commerce real', desc:'Carrito, pagos en linea, tracking. Henry hace envios en SJ.', area:'tienda', owner:'J', priority:'low', status:'backlog', details:[]},
      {id:'b12', title:'Locucion como servicio', desc:'Area por incursionar. Equipo ya disponible.', area:'expansion', owner:'B', priority:'low', status:'backlog', details:[]},
    ];

    var COLUMNS = [
      {key:'done', title:'Hecho', color:'var(--teal)', dot:'var(--teal)'},
      {key:'progress', title:'En Progreso', color:'var(--blue)', dot:'var(--blue)'},
      {key:'todo', title:'Por Hacer', color:'var(--orange)', dot:'var(--orange)'},
      {key:'backlog', title:'Backlog', color:'var(--ink-muted)', dot:'var(--ink-muted)'},
    ];

    var AREA_CLASS = {tienda:'ct-tienda', contenido:'ct-contenido', web:'ct-web', drm:'ct-drm', expansion:'ct-expansion'};
    var AREA_LABEL = {tienda:'Tienda', contenido:'Contenido', web:'Sitio Web', drm:'Proteccion', expansion:'Expansion'};
    var OWNER_COLORS = {B:'var(--purple)', J:'var(--teal)', JB:'var(--magenta)'};
    var OWNER_LABELS = {B:'Bryan', J:'Jahir', JB:'Ambos'};
    var PRI_CLASS = {critical:'p-critical', high:'p-high', medium:'p-medium', low:'p-low'};
    var PRI_LABEL = {critical:'Critica', high:'Alta', medium:'Media', low:'Baja'};
    var PRI_ORDER = {critical:0, high:1, medium:2, low:3};

    var activeArea = 'all';
    var activeOwner = 'all';

    function render() {
      var board = document.getElementById('board');
      board.innerHTML = '';

      var filtered = CARDS.filter(function(c) {
        if (activeArea !== 'all' && c.area !== activeArea) return false;
        if (activeOwner !== 'all' && c.owner !== activeOwner) return false;
        return true;
      });

      COLUMNS.forEach(function(col) {
        var colCards = filtered.filter(function(c){ return c.status === col.key; });
        colCards.sort(function(a,b){ return PRI_ORDER[a.priority] - PRI_ORDER[b.priority]; });

        var colEl = document.createElement('div');
        colEl.className = 'col';

        var header = document.createElement('div');
        header.className = 'col-header';
        header.innerHTML =
          '<span class="col-dot" style="background:'+col.dot+'"></span>' +
          '<span class="col-title">'+col.title+'</span>' +
          '<span class="col-count">'+colCards.length+'</span>';
        colEl.appendChild(header);

        colCards.forEach(function(c) {
          var card = document.createElement('div');
          card.className = 'card';
          card.style.borderLeftColor = col.color;

          var html = '<div class="card-top">';
          html += '<span class="card-title">'+c.title+'</span>';
          html += '<span class="card-priority '+PRI_CLASS[c.priority]+'">'+PRI_LABEL[c.priority]+'</span>';
          html += '</div>';
          html += '<div class="card-desc">'+c.desc+'</div>';
          html += '<div class="card-meta">';
          html += '<span class="card-tag '+AREA_CLASS[c.area]+'">'+AREA_LABEL[c.area]+'</span>';
          html += '<span class="card-owner"><span class="owner-dot" style="background:'+OWNER_COLORS[c.owner]+'">'+c.owner+'</span>'+OWNER_LABELS[c.owner]+'</span>';
          html += '</div>';

          if (c.details && c.details.length) {
            html += '<div class="card-expand-hint">Click para ver detalles</div>';
            html += '<div class="card-details">';
            c.details.forEach(function(d) {
              html += '<div class="card-detail-item">'+d+'</div>';
            });
            html += '</div>';
          }

          card.innerHTML = html;
          if (c.details && c.details.length) {
            card.addEventListener('click', function(){ this.classList.toggle('expanded'); });
          }
          colEl.appendChild(card);
        });

        board.appendChild(colEl);
      });
    }

    // FILTERS
    document.querySelectorAll('.filter-btn[data-area]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn[data-area]').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        activeArea = this.getAttribute('data-area');
        render();
      });
    });
    document.querySelectorAll('.filter-btn[data-owner]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn[data-owner]').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        activeOwner = this.getAttribute('data-owner');
        render();
      });
    });

    render();
  </script>
</body>
</html>
