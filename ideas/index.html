<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selah Music — Ideas</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F4F1;
      --surface: #FFFFFF;
      --ink: #2C2F3E;
      --ink-soft: #5A5D6E;
      --ink-muted: #8E909E;
      --border: #E8E9ED;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    .header {
      padding: 2rem 1.5rem 1rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .header-logo { height: 32px; }
    .header h1 {
      font-size: 1.35rem; font-weight: 600; color: var(--ink);
      letter-spacing: -0.01em;
    }
    .header-count {
      margin-left: auto;
      font-size: 0.75rem; color: var(--ink-muted); font-weight: 400;
      background: var(--surface); padding: 0.25rem 0.65rem;
      border-radius: 20px;
    }

    /* ─── GRID ─── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      padding: 1rem 1.5rem 2rem;
      max-width: 820px;
      margin: 0 auto;
    }

    /* ─── CATEGORY CARD ─── */
    .cat {
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      position: relative;
    }
    .cat:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .cat:active { transform: scale(0.98); }

    .cat-face {
      padding: 1.35rem 1.15rem;
      min-height: 130px;
      display: flex; flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .cat-icon {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      line-height: 1;
    }
    .cat-label {
      font-size: 1.05rem; font-weight: 600;
      color: var(--ink);
      line-height: 1.25;
    }
    .cat-count {
      font-size: 0.7rem; font-weight: 500;
      color: var(--ink-soft);
      margin-top: 0.35rem;
      opacity: 0.7;
    }
    .cat-arrow {
      position: absolute; bottom: 1rem; right: 1rem;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.06);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.25s;
    }
    .cat-arrow svg {
      width: 12px; height: 12px; color: var(--ink-soft);
    }
    .cat.open .cat-arrow { transform: rotate(90deg); }

    /* ─── EXPANDED IDEAS ─── */
    .cat-ideas {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      background: rgba(255,255,255,0.5);
    }
    .cat.open .cat-ideas {
      max-height: 2000px;
    }
    .cat-ideas-inner {
      padding: 0 1.15rem 1rem;
    }
    .ideas-divider {
      height: 1px;
      background: rgba(0,0,0,0.08);
      margin-bottom: 0.75rem;
    }

    .idea {
      padding: 0.6rem 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .idea + .idea {
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    .idea-row {
      display: flex; align-items: baseline; gap: 0.5rem;
    }
    .idea-title {
      font-size: 0.8rem; font-weight: 500;
      flex: 1; line-height: 1.4;
    }
    .idea-pri {
      font-size: 0.6rem; font-weight: 600;
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .pri-critical { background: rgba(192,57,43,0.12); color: #C0392B; }
    .pri-high { background: rgba(212,152,90,0.15); color: #B07840; }
    .pri-medium { background: rgba(107,159,212,0.12); color: #5A8CBE; }
    .pri-low { background: rgba(0,0,0,0.05); color: var(--ink-muted); }

    .idea-owner {
      font-size: 0.68rem; color: var(--ink-muted);
      margin-top: 0.15rem;
    }

    .idea-detail {
      display: none;
      margin-top: 0.4rem;
      padding: 0.5rem 0.65rem;
      background: rgba(255,255,255,0.6);
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .idea.expanded .idea-detail { display: block; }

    .idea-desc {
      font-size: 0.73rem; color: var(--ink-soft);
      line-height: 1.55; margin-bottom: 0.3rem;
    }
    .idea-bullets { list-style: none; }
    .idea-bullets li {
      font-size: 0.7rem; color: var(--ink-soft);
      line-height: 1.55; padding-left: 0.8rem;
      position: relative;
    }
    .idea-bullets li::before {
      content: '\2022'; position: absolute; left: 0;
      color: var(--ink-muted);
    }

    /* ─── FULL WIDTH ON OPEN ─── */
    .cat.open {
      grid-column: 1 / -1;
    }

    /* ─── BACK ─── */
    .back {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.75rem; color: var(--ink-muted);
      text-decoration: none; padding: 0 1.5rem;
      transition: color 0.15s;
    }
    .back:hover { color: var(--ink-soft); }
    .back svg { width: 14px; height: 14px; }

    /* ─── MOBILE ─── */
    @media (max-width: 520px) {
      .header { padding: 1.5rem 1rem 0.75rem; }
      .grid { grid-template-columns: 1fr; padding: 0.75rem 1rem 2rem; gap: 0.6rem; }
      .cat-face { min-height: 90px; padding: 1rem; }
      .cat-icon { font-size: 1.3rem; }
      .cat-label { font-size: 0.95rem; }
      .back { padding: 0 1rem; }
      .cat.open { grid-column: 1; }
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="../img/img-8.png" alt="Selah" class="header-logo">
    <h1>Ideas</h1>
    <span class="header-count" id="totalCount"></span>
  </div>
  <a href="../" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Volver al sitio</a>

  <div class="grid" id="grid"></div>

  <script>
    var CATS = [
      {
        id: 'tienda', label: 'Tienda', icon: '🎸',
        bg: '#E8F5F3', accent: '#3D9B8F',
        items: [
          {id:'t-inv', title:'Inversion inicial ₡200k', desc:'Jahir pone ₡200k el 2 de noviembre para arrancar. Cuerdas, cables, stands.', owner:'Jahir', priority:'critical',
            details:['Plan 1 (₡200k): cuerdas, cables, stands','Plan 2 (₡350k): + audifonos, ukeleles, guitarras','Plan 3 (₡450k): + teclados, sistema de apartado','Inversion completa estimada: ₡800k','Pago: SINPE o efectivo']},
          {id:'t-fin', title:'Financiamiento a clientes', desc:'Cuotas mientras estudia, contrato + cedula. Instrumento en bodega hasta cancelar.', owner:'Bryan', priority:'high',
            details:['Stratocaster combo para Jahir: ₡210k en 3x ₡70k','16 combos disponibles, 4 colores']},
          {id:'t-mar', title:'Margenes confirmados', desc:'Teclado, cuerdas, combos — margenes mapeados con proveedor.', owner:'Ambos', priority:'high',
            details:['Teclado: venta ₡89,900 / costo ~₡23,000','Cuerdas: venta ₡18,000 / costo ~₡3,100','Margen por instrumento: ~₡25,000 netos','Bateria electrica ₡375k / normal ₡475k']},
          {id:'t-con', title:'Consignacion con proveedor', desc:'Proveedor envia mercaderia, se devuelve lo no vendido.', owner:'Bryan', priority:'medium',
            details:['Proveedor en Heredia','Entrega en 10 dias tras cancelacion total','Primera compra minima ~₡570k']},
          {id:'t-mic', title:'Microfonos para Broers', desc:'Contacto exclusivo de microfonos de cable.', owner:'Bryan', priority:'medium', details:[]},
          {id:'t-tmp', title:'Temporadas clave', desc:'Sept, Navidad, Dia del Nino, Dia de la Madre/Padre.', owner:'Ambos', priority:'medium', details:[]},
          {id:'t-eco', title:'E-commerce real', desc:'Carrito, pagos en linea, tracking.', owner:'Jahir', priority:'low', details:[]},
        ]
      },
      {
        id: 'contenido', label: 'Contenido', icon: '🎥',
        bg: '#F0ECF5', accent: '#9B7BBF',
        items: [
          {id:'c-short', title:'Video shorts', desc:'Bryan grabo piezas musicales. Falta editar mezcla. Bryan trabajando en esto hoy (27 oct).', owner:'Bryan', priority:'critical',
            details:['Piezas conocidas y rapidas para shorts','Falta mezclar video + audio','Bryan dedicando el 27 oct a preparar videos y anuncios']},
          {id:'c-foto', title:'Fotos reales', desc:'Reemplazar stock de Canva con fotos reales de la academia.', owner:'Bryan', priority:'high', details:[]},
          {id:'c-user', title:'Unificar usernames', desc:'IG, TikTok, YouTube — definir juntos.', owner:'Ambos', priority:'high',
            details:['IG: usar @selahamusicacademia (original)','TikTok: cambiar de _cr a selahamusicacademia','YouTube: Jahir necesita credenciales']},
          {id:'c-anun', title:'Anuncios estilo competencia', desc:'Crear anuncios propios al formato Selah. 5 referencias guardadas.', owner:'Ambos', priority:'high',
            details:['Jahir guardando anuncios de competencia como referencia','4 posts de IG + 1 video de YouTube recopilados','Post + historia destacada']},
          {id:'c-test', title:'Videos de testimonios', desc:'Familia 3G, nino prodigio, entrevistas a papas.', owner:'Bryan', priority:'high',
            details:['Familia 3G: abuelo, hijo, nieto','Nino prodigio: llego a los 4, ahora tiene 10']},
          {id:'c-yt', title:'Canal de YouTube', desc:'Crear/configurar canal oficial y embeber en el sitio.', owner:'Ambos', priority:'high', details:[]},
          {id:'c-mosaic', title:'Video mosaico/cuadricula', desc:'Cada musico toca su parte en un cuadrito que se va sumando hasta la cancion completa.', owner:'Bryan', priority:'high',
            details:['Estilo flamenco: guitarra, palmas, zapateo, canto','Cuadros visibles todos a la vez, no secuencial','Puede ser varias personas o one-man-band (Bryan solo)','Ref: youtu.be/to2iDSr6_KA min 1:25']},
          {id:'c-estr', title:'Estrategia definida', desc:'Publicidad (destacada) vs contenido de respaldo (posts).', owner:'Ambos', priority:'high',
            details:['Anuncios: post + historia destacada','Shorts/piezas: posts normales','Eventualmente FB/IG Ads']},
        ]
      },
      {
        id: 'web', label: 'Sitio Web', icon: '🌐',
        bg: '#F8EEF2', accent: '#C06B8E',
        items: [
          {id:'w-v1', title:'Completar datos V1', desc:'14 items pendientes de Bryan. El va a revisar la pagina hoy (27 oct) para completar datos.', owner:'Bryan', priority:'critical',
            details:['Cantidad alumnos e instrumentos','Foto + bio de Bryan','Nombres/fotos de 3 profesores','Videos testimonios','Precios confirmados','Catalogo tienda completo','Link YouTube / pista PGM']},
          {id:'w-live', title:'V1 en vivo', desc:'Responsive, SEO, WhatsApp, redes, deploy en Vercel.', owner:'Jahir', priority:'high',
            details:['selah-indol.vercel.app','Instrumentos clickeables','Tienda, precios, testimonios']},
          {id:'w-pal', title:'Paleta alineada', desc:'Teal, purple, magenta con contraste WCAG AA.', owner:'Jahir', priority:'medium', details:[]},
          {id:'w-qr', title:'QR en libros fisicos', desc:'Codigo QR que redirige a la pagina. Actualizable.', owner:'Ambos', priority:'medium', details:[]},
          {id:'w-book', title:'Preview libros (Issuu)', desc:'Visor flipbook para hojear los libros del PGM online.', owner:'Jahir', priority:'medium', details:[]},
          {id:'w-gal', title:'Galeria de fotos/videos', desc:'Presentaciones, recitales, clases.', owner:'Ambos', priority:'low', details:[]},
          {id:'w-insc', title:'Inscripcion online', desc:'Formulario de matricula con seleccion de instrumento.', owner:'Jahir', priority:'low', details:[]},
          {id:'w-app', title:'App movil / PWA', desc:'Version app del sitio.', owner:'Jahir', priority:'low', details:[]},
        ]
      },
      {
        id: 'proteccion', label: 'Proteccion', icon: '🔒',
        bg: '#FDF5EC', accent: '#D4985A',
        items: [
          {id:'p-agua', title:'Marca de agua digital', desc:'"Selah Music by Bryan Martinez" en contenido descargable.', owner:'Jahir', priority:'medium', details:[]},
          {id:'p-vid', title:'DRM para videos', desc:'Vimeo Starter (~$12/mes) o Hotmart (gratis, cobra %).', owner:'Jahir', priority:'low',
            details:['Vimeo Starter: ~$12/mes, sin descarga','Hotmart: gratis, cobra % por venta']},
          {id:'p-pdf', title:'Proteccion de PDFs', desc:'Issuu gratis con ads, o $19/mes sin ads.', owner:'Jahir', priority:'low', details:[]},
        ]
      },
      {
        id: 'expansion', label: 'Expansion', icon: '🚀',
        bg: '#ECF2FA', accent: '#6B9FD4',
        items: [
          {id:'e-maps', title:'Google Maps registrado', desc:'Ya existia perfil "Shalala Music Academy" en Promenade. Solicitud para administrar enviada 27 oct.', owner:'Jahir', priority:'medium',
            details:['Perfil existente: 5.0 estrellas, 2 resenas','Ubicacion: Promenade de la Casa Presidencial, Zapote','Deadline respuesta: 30 oct 2026','Solicitud anterior (25 oct) tambien en revision']},
          {id:'e-red', title:'Red de academias', desc:'Meta: una nueva por ano. Joan y Monica como subdirectores.', owner:'Bryan', priority:'low',
            details:['Criterio: paciencia + adherencia al metodo','Profesores que abran su propia academia = orgullo']},
          {id:'e-loc', title:'Locucion como servicio', desc:'Area por incursionar. Equipo ya disponible.', owner:'Bryan', priority:'low', details:[]},
        ]
      },
      {
        id: 'servicios', label: 'Servicios', icon: '🎤',
        bg: '#F5F1ED', accent: '#B8A08A',
        items: [
          {id:'s-grab', title:'Grabacion', desc:'Podcasts, anuncios radiales, musica virtual y en vivo.', owner:'Bryan', priority:'medium', details:[]},
          {id:'s-bod', title:'Bodas y eventos', desc:'Repertorio de 5 canciones a eleccion.', owner:'Bryan', priority:'medium', details:[]},
          {id:'s-tal', title:'Talleres', desc:'Ensamble, teoria, sonido, canto, composicion, arreglo coral.', owner:'Bryan', priority:'medium', details:[]},
          {id:'s-rep', title:'Reparacion', desc:'Instrumentos y equipo de sonido.', owner:'Bryan', priority:'low', details:[]},
          {id:'s-env', title:'Envios', desc:'Henry en San Jose, correos al resto del pais.', owner:'Bryan', priority:'low', details:[]},
          {id:'s-aud', title:'Curso audio/produccion', desc:'Hermano de Bryan (baterista y sonidista profesional).', owner:'Bryan', priority:'low', details:[]},
        ]
      },
    ];

    var PRI = {critical:'Critica', high:'Alta', medium:'Media', low:'Baja'};

    var total = 0;
    CATS.forEach(function(c) { total += c.items.length; });
    document.getElementById('totalCount').textContent = total + ' ideas';

    function render() {
      var html = '';
      CATS.forEach(function(cat) {
        html += '<div class="cat" data-cat="' + cat.id + '" style="background:' + cat.bg + '">';

        html += '<div class="cat-face" onclick="toggle(\'' + cat.id + '\')">';
        html += '<div><span class="cat-icon">' + cat.icon + '</span>';
        html += '<div class="cat-label">' + cat.label + '</div>';
        html += '<div class="cat-count">' + cat.items.length + ' ideas</div></div>';
        html += '<div class="cat-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></div>';
        html += '</div>';

        html += '<div class="cat-ideas"><div class="cat-ideas-inner">';
        html += '<div class="ideas-divider"></div>';

        cat.items.forEach(function(item) {
          var has = item.desc || (item.details && item.details.length > 0);
          html += '<div class="idea" data-idea="' + item.id + '"' + (has ? ' onclick="toggleIdea(event,\'' + item.id + '\')"' : '') + '>';
          html += '<div class="idea-row">';
          html += '<div class="idea-title">' + item.title + '</div>';
          html += '<span class="idea-pri pri-' + item.priority + '">' + PRI[item.priority] + '</span>';
          html += '</div>';
          html += '<div class="idea-owner">' + item.owner + '</div>';

          if (has) {
            html += '<div class="idea-detail">';
            if (item.desc) html += '<div class="idea-desc">' + item.desc + '</div>';
            if (item.details && item.details.length > 0) {
              html += '<ul class="idea-bullets">';
              item.details.forEach(function(d) { html += '<li>' + d + '</li>'; });
              html += '</ul>';
            }
            html += '</div>';
          }

          html += '</div>';
        });

        html += '</div></div></div>';
      });

      document.getElementById('grid').innerHTML = html;
    }

    function toggle(id) {
      var el = document.querySelector('[data-cat="' + id + '"]');
      if (!el) return;
      var wasOpen = el.classList.contains('open');
      el.classList.toggle('open');
      if (!wasOpen) {
        setTimeout(function() {
          el.scrollIntoView({behavior:'smooth', block:'start'});
        }, 50);
      }
    }

    function toggleIdea(e, id) {
      e.stopPropagation();
      var el = document.querySelector('[data-idea="' + id + '"]');
      if (el) el.classList.toggle('expanded');
    }

    render();
  </script>
</body>
</html>
